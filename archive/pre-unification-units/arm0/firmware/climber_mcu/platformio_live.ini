; V3 local compile uses the installed espressif32 6.13.0 and bundled libraries.
; Original platformio.ini (7.0.0) is preserved. Review toolchain before deployment.
[platformio]
default_envs = bringup_unit0

[env:esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<main.cpp>
lib_deps = 
	https://github.com/micro-ROS/micro_ros_platformio
	https://github.com/odriverobotics/ODriveArduino.git
	https://github.com/basicmicro/roboclaw_arduino_library.git
board_microros_distro = humble
board_microros_transport = serial
build_flags = 
	-DARM_ID=0
	-DCONTROL_LOOP_HZ=50
	-DSTATE_PUBLISH_HZ=50
	-DCOMMS_TIMEOUT_MS=200
	-DTOF_READ_HZ=50

[env:bringup]
platform = espressif32@6.13.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<bringup.cpp>
lib_deps = 
	symlink://../../../arm1/firmware/climber_mcu/vendor/ODriveArduino
	symlink://vendor/roboclaw_arduino_library
build_flags = 
	-DBRINGUP_FIRMWARE=1
	-DUNIT_ID=0
	-DLOCAL_ODRIVE_NODE_ID=0

[env:bringup_unit0]
extends = env:bringup
lib_deps = 
	symlink://../../../arm1/firmware/climber_mcu/vendor/ODriveArduino
	symlink://vendor/roboclaw_arduino_library
build_flags = 
	-DBRINGUP_FIRMWARE=1
	-DUNIT_ID=0
	-DLOCAL_ODRIVE_NODE_ID=0

[env:bringup_unit1]
extends = env:bringup
build_flags = 
	-DBRINGUP_FIRMWARE=1
	-DUNIT_ID=1
	-DLOCAL_ODRIVE_NODE_ID=0

[env:bringup_unit2]
extends = env:bringup
build_flags = 
	-DBRINGUP_FIRMWARE=1
	-DUNIT_ID=2
	-DLOCAL_ODRIVE_NODE_ID=0
	-DACTUATOR_MIN_ENCODER_RANGE_TICKS_CONFIG=1330

[env:bringup_unit3]
extends = env:bringup
build_flags = 
	-DBRINGUP_FIRMWARE=1
	-DUNIT_ID=3
	-DLOCAL_ODRIVE_NODE_ID=0

