[platformio]
default_envs = bringup_unit3

; PlatformIO configuration for Climber MCU firmware
; Each MCU controls one arm assembly (wheel + linear actuator + ToF sensors)
;
; Duplicate this project for each MCU and set the ARM_ID build flag:
;   N=0, W=1, S=2, E=3
;
; Or use a single firmware binary and set the arm ID at runtime via
; a DIP switch / EEPROM / serial command.

[env:esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<main.cpp>

; micro-ROS and hardware libraries for Arduino
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/adafruit/Adafruit_VL53L0X.git
    https://github.com/odriverobotics/ODriveArduino.git
    https://github.com/basicmicro/roboclaw_arduino_library.git
board_microros_distro = humble

; Custom micro-ROS packages must live in <project>/extra_packages
; (e.g. extra_packages/climber_msgs)

board_microros_transport = serial

build_flags =
    -DARM_ID=0             ; 0=N, 1=W, 2=S, 3=E (override per-MCU)
    -DCONTROL_LOOP_HZ=50
    -DSTATE_PUBLISH_HZ=50
    -DCOMMS_TIMEOUT_MS=200
    -DTOF_READ_HZ=50

[env:bringup]
platform = espressif32@7.0.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<bringup.cpp>
lib_deps =
    https://github.com/adafruit/Adafruit_VL53L0X.git
    https://github.com/odriverobotics/ODriveArduino.git#f52eef5d72d65c64f4853b55fd31626dec52eafd
    https://github.com/basicmicro/roboclaw_arduino_library.git#83c031b6476599045ddfdf32fd4f4efa4ee5a79f
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=0
    -DLOCAL_ODRIVE_NODE_ID=0

; bringup_unit0..3 give each ESP32 a unique unit id for USB/Jetson control.
; LOCAL_ODRIVE_NODE_ID is left at 0 because each ESP32 is expected to talk to
; its own local ODrive. If your ODrives share one CAN bus and use node IDs 0..3,
; change LOCAL_ODRIVE_NODE_ID for each unit to match the ODrive wired to it.

[env:bringup_unit0]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=0
    -DLOCAL_ODRIVE_NODE_ID=0

[env:bringup_unit1]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=1
    -DLOCAL_ODRIVE_NODE_ID=0

[env:bringup_unit2]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=2
    -DLOCAL_ODRIVE_NODE_ID=0
    ; Unit 2 consistently measures a 1343-1344 tick full stroke.
    ; Keep a small acceptance margin without weakening the other units.
    -DACTUATOR_MIN_ENCODER_RANGE_TICKS_CONFIG=1330

[env:bringup_unit3]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=3
    -DLOCAL_ODRIVE_NODE_ID=0
