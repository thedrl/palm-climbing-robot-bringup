[platformio]
default_envs = bringup_unit0

; Canonical PlatformIO configuration for Climber MCU firmware.
; All four arms (0..3) build from this single project; per-unit pinout and
; hardware traits are declared in src/unit_config.h and selected via -DUNIT_ID.

[env:esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<main.cpp>

; micro-ROS and hardware libraries for Arduino
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/odriverobotics/ODriveArduino.git
    https://github.com/basicmicro/roboclaw_arduino_library.git
board_microros_distro = humble

; Custom micro-ROS packages must live in <project>/extra_packages
; (e.g. extra_packages/climber_msgs)

board_microros_transport = serial

build_flags =
    -DARM_ID=0             ; 0=N, 1=W, 2=S, 3=E (override per-MCU)
    -DCONTROL_LOOP_HZ=50
    -DSTATE_PUBLISH_HZ=50
    -DCOMMS_TIMEOUT_MS=200
    -DTOF_READ_HZ=50

[env:bringup]
platform = espressif32@7.0.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<bringup.cpp>
lib_deps =
    symlink://vendor/ODriveArduino
    symlink://vendor/roboclaw_v448
    symlink://vendor/Adafruit_VL53L0X
lib_ignore =
    Adafruit SSD1306
    Adafruit GFX Library
    Adafruit BusIO
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=0
    -DLOCAL_ODRIVE_NODE_ID=0
    -DENABLE_BENCH_DIAGNOSTICS=0

; bringup_unit0..3 build from unified src/ using src/unit_config.h traits.
; LOCAL_ODRIVE_NODE_ID is left at 0 because each ESP32 talks to its own local ODrive.

[env:bringup_unit0]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=0
    -DLOCAL_ODRIVE_NODE_ID=0
    -DENABLE_BENCH_DIAGNOSTICS=0

[env:bringup_unit1]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=1
    -DLOCAL_ODRIVE_NODE_ID=0
    -DENABLE_BENCH_DIAGNOSTICS=0

[env:bringup_unit2]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=2
    -DLOCAL_ODRIVE_NODE_ID=0
    -DENABLE_BENCH_DIAGNOSTICS=0

[env:bringup_unit3]
extends = env:bringup
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=3
    -DLOCAL_ODRIVE_NODE_ID=0
    -DENABLE_BENCH_DIAGNOSTICS=0

[env:bringup_unit0_bench]
extends = env:bringup_unit0
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=0
    -DLOCAL_ODRIVE_NODE_ID=0
    -DENABLE_BENCH_DIAGNOSTICS=1

[env:bringup_unit2_bench]
extends = env:bringup_unit2
build_flags =
    -DBRINGUP_FIRMWARE=1
    -DUNIT_ID=2
    -DLOCAL_ODRIVE_NODE_ID=0
    -DENABLE_BENCH_DIAGNOSTICS=1
